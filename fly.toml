# Fly.io configuration for Bíblia Sagrada API
app = "biblia-sagrada-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "bible_data"
  destination = "/app/data"
  initial_size = "1gb"
  max_size = "5gb"
